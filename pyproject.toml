[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmmind"
version = "0.1.0"
description = "SwarmMind: a signed, mandate-carrying message protocol for collaborating AI agents, with a Flower transport"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["swarmauth @ git+https://github.com/hiveflowai/swarmauth.git"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["swarmmind"]
